# Constrói E implanta.
#
# O gatilho anterior era do tipo "Buildpacks", que só faz o BUILD: a imagem
# ia parar no registry, mas nenhuma revisão nova subia no Cloud Run. Por isso
# o serviço ficou dias servindo código antigo com todos os builds verdes.
#
# O `dir:` no passo de build é obrigatório: no modo "arquivo de
# configuração", os passos rodam a partir da RAIZ do repositório, não da
# pasta do serviço (diferente do modo Buildpacks, que tinha o campo
# "diretório de compilação" no próprio gatilho).
#
# GOOGLE_FUNCTION_TARGET é obrigatório no build: estes serviços são Cloud
# Run *functions*, e o package.json não tem main nem scripts.start - quem
# instala o functions-framework e define o entrypoint do container é o
# buildpack, e só quando recebe essa variável. Sem ela o build passa mas a
# revisão não sobe ("Creating Revision... failed").
#
# _SERVICE_NAME e _REGION abaixo foram confirmados contra o Cloud Run
# (`gcloud run services list`) em 19/08/2026. O passo de deploy usa
# `services update`, que FALHA se o serviço não existir com esse
# nome/região - de propósito, pra errar alto em vez de criar um serviço
# duplicado silenciosamente.

substitutions:
  _FUNCTION_TARGET: generateMicroActivity
  _SERVICE_NAME: generate-micro-activity
  _REGION: europe-west1

steps:
  # O validar-lugares.js vive na pasta do generate-trip e é usado pelos
  # dois serviços. Como o contexto do `pack` é a pasta do serviço
  # (`--path=.`), nada de fora dela entra na imagem - então o arquivo é
  # copiado para cá ANTES do build. Sem este passo o build passa e a
  # revisão quebra em runtime, no require.
  #
  # Uma cópia só, de uma origem só: o `pretest` do package.json copia do
  # mesmo lugar, então o que o teste local exercita é o que roda em
  # produção. A cópia nunca é commitada (está no .gitignore da raiz), para
  # não voltar à pergunta "qual das duas é a fonte da verdade".
  - id: copia-validacao
    name: gcr.io/cloud-builders/gcloud
    entrypoint: cp
    args:
      - services-generate-trip-trix-1785854447/validar-lugares.js
      - services-generate-micro-activity-1785854365/validar-lugares.js

  - id: build
    name: gcr.io/k8s-skaffold/pack
    dir: services-generate-micro-activity-1785854365
    entrypoint: pack
    args:
      - build
      - gcr.io/$PROJECT_ID/trix-generate-micro-activity:$COMMIT_SHA
      - --builder=gcr.io/buildpacks/builder
      - --env=GOOGLE_FUNCTION_TARGET=${_FUNCTION_TARGET}
      - --path=.

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/trix-generate-micro-activity:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/trix-generate-micro-activity:$COMMIT_SHA
      - --region=${_REGION}
      # O handler gasta no pior caso 48s (40s de Gemini + 8s de Google em
      # paralelo), pensado para caber embaixo dos 60s em que o app aborta.
      # Este teto precisa ser MAIOR que o nosso, senão quem corta é a
      # plataforma - e plataforma cortando mata o processo, sem log e sem
      # resposta.
      #
      # 90s é folga para os 48s mais a serialização da resposta. Explícito
      # no arquivo, e não só no console, para não voltar ao padrão de 60s
      # silenciosamente num serviço recriado.
      - --timeout=90

images:
  - gcr.io/$PROJECT_ID/trix-generate-micro-activity:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
