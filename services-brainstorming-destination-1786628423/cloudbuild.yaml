# Constrói E implanta.
#
# O gatilho anterior era do tipo "Buildpacks", que só faz o BUILD: a imagem
# ia parar no registry, mas nenhuma revisão nova subia no Cloud Run. Por isso
# o serviço ficou dias servindo código antigo com todos os builds verdes.
#
# O `dir:` no passo de build é obrigatório: no modo "arquivo de
# configuração", os passos rodam a partir da RAIZ do repositório, não da
# pasta do serviço (diferente do modo Buildpacks, que tinha o campo
# "diretório de compilação" no próprio gatilho).
#
# GOOGLE_FUNCTION_TARGET é obrigatório no build: estes serviços são Cloud
# Run *functions*, e o package.json não tem main nem scripts.start - quem
# instala o functions-framework e define o entrypoint do container é o
# buildpack, e só quando recebe essa variável. Sem ela o build passa mas a
# revisão não sobe ("Creating Revision... failed").
#
# _SERVICE_NAME e _REGION abaixo foram confirmados contra o Cloud Run
# (`gcloud run services list`) em 19/08/2026. O passo de deploy usa
# `services update`, que FALHA se o serviço não existir com esse
# nome/região - de propósito, pra errar alto em vez de criar um serviço
# duplicado silenciosamente.

substitutions:
  _FUNCTION_TARGET: generateBrainstorming
  _SERVICE_NAME: brainstorming-destination
  _REGION: europe-west1

steps:
  - id: build
    name: gcr.io/k8s-skaffold/pack
    dir: services-brainstorming-destination-1786628423
    entrypoint: pack
    args:
      - build
      - gcr.io/$PROJECT_ID/trix-brainstorming-destination:$COMMIT_SHA
      - --builder=gcr.io/buildpacks/builder
      - --env=GOOGLE_FUNCTION_TARGET=${_FUNCTION_TARGET}
      - --path=.

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/trix-brainstorming-destination:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/trix-brainstorming-destination:$COMMIT_SHA
      - --region=${_REGION}
      # Este serviço rodava no padrão de 60s e sem nenhum teto próprio na
      # chamada ao Gemini - a mesma combinação que derrubou a trip 242 no
      # generate-trip. Quando a plataforma corta, ela mata o processo: o
      # catch não roda e a linha fica presa em 'generating'.
      #
      # Agora o handler aborta em 45s, então quem falha primeiro é sempre o
      # nosso lado, que sabe gravar 'failed'. Os 90s aqui são a folga para o
      # catch e a escrita no Supabase acontecerem depois disso.
      #
      # Fica explícito no arquivo, e não só no console, para não voltar ao
      # padrão silenciosamente num serviço recriado.
      - --timeout=90

images:
  - gcr.io/$PROJECT_ID/trix-brainstorming-destination:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
